<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#080b12">
    <title>修复登录缓存</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 22px;
        background: linear-gradient(180deg, #090d18, #05070c);
        color: #f4f7fb;
      }

      main {
        width: min(100%, 420px);
        border: 1px solid rgba(154, 172, 208, 0.18);
        border-radius: 22px;
        padding: 22px;
        background: rgba(17, 23, 38, 0.94);
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 26px;
      }

      p {
        margin: 0 0 16px;
        color: #c9d3e4;
        line-height: 1.6;
      }

      .status {
        border: 1px solid rgba(255, 209, 102, 0.28);
        border-radius: 14px;
        padding: 12px;
        color: #ffd166;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>正在修复登录缓存</h1>
      <p>会清理旧网页脚本、旧登录状态，然后自动打开最新版。你的项目和打星记录不会被删除。</p>
      <div class="status" id="status">处理中...</div>
    </main>

    <script>
      const statusEl = document.getElementById("status");

      async function resetApp() {
        try {
          localStorage.removeItem("combat-power-auth");
          sessionStorage.clear();

          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }

          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.filter((key) => key.includes("combat-power")).map((key) => caches.delete(key)));
          }

          statusEl.textContent = "修复完成，正在打开最新版...";
          window.setTimeout(() => {
            window.location.replace("./index.html?fresh=20260915-v15#settings");
          }, 700);
        } catch (error) {
          console.error(error);
          statusEl.textContent = "自动修复失败，请关闭 Safari 后重新打开网页";
        }
      }

      resetApp();
    </script>
  </body>
</html>
